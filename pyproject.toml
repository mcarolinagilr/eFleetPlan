[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "efleetplan"
version = "1.2"
description = "Co-optimisation tool of charging infrastructure investment and electric fleet operations. EFleetPlan is a Python-based tool for optimizing charging infrastructure and operations for electric light commercial vehicles (LCVs)."
readme = "README.md"
requires-python = ">=3.10"  # compatible with your numpy/pandas/matplotlib set

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research", 
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

license = Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
license_files = { file = "LICENSE.txt" }
keywords = ["EV", "optimization", "Pyomo", "fleet", "charging", "infrastructure", "LCV"]

authors = [
  { name = "Carolina Gil Ribeiro", email = "mcgr2@kth.se" },
  { name = "KTH Royal Institute of Technology" }
]

# Core runtime dependencies from your scan (normalized)
dependencies = [
  "numpy>=2.3,<3.0",
  "pandas>=2.3,<3.0",
  "matplotlib>=3.10,<4.0",
  "pyomo>=6.9,<7.0"
  "pydantic>=2.0,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.urls]
Repository = "https://github.com/mcarolinagilr/efleetplan"
Issues = "https://github.com/mcarolinagilr/efleetplan/issues"
