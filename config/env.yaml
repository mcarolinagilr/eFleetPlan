# =============================================================================
# Environment Configuration
# =============================================================================
# Controls simulation and optimisation timeframe, random seed, and file paths (inputs and outputs).

seed: 42

# Timeplan for simulation and optimisation

simulation:
  start_date: "2024-01-01 00:00:00"
  end_date: "2024-12-31 23:00:00"
  freq: "h"  # frequency string: 'h' = hourly

optimisation:
  start_date: "2024-01-01 00:00:00"
  end_date: "2024-01-31 23:00:00"
  freq: "h"  # frequency string: 'h' = hourly

paths:
  consumption_factor_file: "../data/Input/consumption_factor_2024.csv"
  output_base: "../data/Output"
  input_for_optimisation: "/data/Output"
  # in case is the output of the fleet operation simulation package put the same folder of output_base
  